<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบ Checklist & แผนที่ลงพื้นที่ รพ.สต.</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-5 space-y-5">
    
    <!-- Header Banner -->
    <div class="bg-gradient-to-r from-blue-700 to-indigo-600 rounded-xl p-4 text-white shadow-md">
      <h1 class="text-xl font-bold tracking-wide">📋 รายงานการลงพื้นที่ รพ.สต.</h1>
      <p class="text-xs text-blue-100 mt-1">ระบบติดตามการปฏิบัติงานและเช็คอินพิกัด GPS</p>
    </div>

    <!-- Dashboard Summary Cards -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-center shadow-sm">
        <p class="text-[11px] text-slate-500 font-semibold uppercase">ทั้งหมด</p>
        <p id="stat-total" class="text-2xl font-bold text-slate-800">0</p>
        <p class="text-[10px] text-slate-400">แห่ง</p>
      </div>
      <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center shadow-sm">
        <p class="text-[11px] text-emerald-600 font-semibold uppercase">ลงพื้นที่แล้ว</p>
        <p id="stat-checked" class="text-2xl font-bold text-emerald-700">0</p>
        <p id="stat-percent" class="text-[10px] text-emerald-600 font-medium">0%</p>
      </div>
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-center shadow-sm">
        <p class="text-[11px] text-amber-600 font-semibold uppercase">คงเหลือ</p>
        <p id="stat-pending" class="text-2xl font-bold text-amber-700">0</p>
        <p class="text-[10px] text-amber-600 font-medium">แห่ง</p>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="bg-slate-50 border rounded-xl p-3 space-y-1.5 shadow-sm">
      <div class="flex justify-between text-xs font-semibold text-slate-700">
        <span>อัตราความก้าวหน้า</span>
        <span id="progress-text" class="text-emerald-600">0%</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
        <div id="progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>

    <!-- Interactive Map -->
    <div>
      <h2 class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-1">📍 แผนที่ตำแหน่ง รพ.สต.</h2>
      <div id="map" class="w-full h-56 rounded-xl border border-slate-200 shadow-inner z-0"></div>
    </div>

    <!-- Checklist Header & Sorting -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-700">📝 รายชื่อ รพ.สต. ในพื้นที่</h2>
        <select id="sort-select" onchange="fetchHospitals()" class="text-xs border rounded-lg p-1.5 bg-slate-50 text-slate-600 focus:outline-none focus:ring-1 focus:ring-blue-500">
          <option value="id-asc">เรียงตามลำดับ ID (1-9)</option>
          <option value="name-asc">เรียงตามชื่อ (ก-ฮ)</option>
          <option value="status-pending">ยังไม่ได้ลงพื้นที่ขึ้นก่อน</option>
          <option value="status-checked">ลงพื้นที่แล้วขึ้นก่อน</option>
        </select>
      </div>

      <div id="hospital-list" class="space-y-3">
        <p class="text-xs text-slate-400 text-center py-4">กำลังโหลดข้อมูล...</p>
      </div>
    </div>

  </div>

  <!-- Check-in Modal -->
  <div id="checkin-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
      <h2 id="modal-title" class="text-lg font-bold text-slate-800 border-b pb-2">📍 เช็คอินบันทึกการลงพื้นที่</h2>
      
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ตำแหน่ง GPS</label>
        <p id="gps-status" class="text-xs text-slate-500 bg-slate-100 p-2 rounded-lg border">กำลังค้นหาตำแหน่ง GPS...</p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ถ่ายภาพ / อัปโหลดรูปภาพ</label>
        <input type="file" id="photo-input" accept="image/*" capture="environment" 
               class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border rounded-lg">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">หมายเหตุการลงพื้นที่</label>
        <textarea id="note-input" rows="2" class="w-full border rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none" placeholder="บันทึกรายละเอียด ผลการปฏิบัติงาน หรือหมายเหตุ..."></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">ยกเลิก</button>
        <button id="save-btn" onclick="saveCheckin()" class="px-4 py-2 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow">บันทึกข้อมูล</button>
      </div>
    </div>
  </div>

  <script>
    // ตั้งค่า Supabase credentials
    const SUPABASE_URL = 'https://gvakjpngvhftmuzsxpyw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Z27zX48J2cPc2i3Xe1z_DA_MoLrTzGG';
    
    // ประกาศชื่อตัวแปรเป็น supabaseClient เพื่อป้องกันปัญหาชื่อชนกับ SDK
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentHospitalId = null;
    let currentLat = null;
    let currentLng = null;
    let map = null;
    let markers = [];

    function initMap() {
      map = L.map('map').setView([17.0078, 99.8234], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    }

    async function fetchHospitals() {
      const sortVal = document.getElementById('sort-select').value;
      let query = supabaseClient.from('hospitals').select('*');

      if (sortVal === 'id-asc') {
        query = query.order('id', { ascending: true });
      } else if (sortVal === 'name-asc') {
        query = query.order('name', { ascending: true });
      } else if (sortVal === 'status-pending') {
        query = query.order('is_checked', { ascending: true }).order('id', { ascending: true });
      } else if (sortVal === 'status-checked') {
        query = query.order('is_checked', { ascending: false }).order('id', { ascending: true });
      }

      const { data, error } = await query;
      
      if (error) {
        console.error("Supabase Fetch Error:", error);
        document.getElementById('hospital-list').innerHTML = `<p class="text-xs text-red-500 text-center py-4">ไม่สามารถโหลดข้อมูลได้ (${error.message || 'Error'})</p>`;
        return;
      }

      const total = data.length;
      const checked = data.filter(item => item.is_checked).length;
      const pending = total - checked;
      const percent = total > 0 ? Math.round((checked / total) * 100) : 0;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-checked').innerText = checked;
      document.getElementById('stat-pending').innerText = pending;
      document.getElementById('stat-percent').innerText = `${percent}%`;
      document.getElementById('progress-text').innerText = `${percent}%`;
      document.getElementById('progress-bar').style.width = `${percent}%`;

      const listDiv = document.getElementById('hospital-list');
      listDiv.innerHTML = '';
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      const bounds = [];

      data.forEach(item => {
        const div = document.createElement('div');
        div.className = `p-3.5 border rounded-xl space-y-2 transition-all ${item.is_checked ? 'bg-emerald-50/60 border-emerald-300' : 'bg-slate-50 border-slate-200'}`;
        
        let content = `
          <div class="flex items-center justify-between">
            <div>
              <p class="font-bold text-sm ${item.is_checked ? 'text-emerald-900' : 'text-slate-800'}">${item.name}</p>
              <p class="text-xs text-slate-500">${item.area || ''}</p>
            </div>
            <input type="checkbox" ${item.is_checked ? 'checked' : ''} 
                   onchange="handleCheckChange(${item.id}, this.checked)"
                   class="w-5 h-5 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer accent-emerald-600">
          </div>
        `;

        if (item.is_checked) {
          content += `
            <div class="text-xs text-slate-600 bg-white p-2.5 rounded-lg border border-emerald-100 space-y-1">
              <p class="text-slate-500">⏰ เวลาเช็คอิน: ${new Date(item.checked_at).toLocaleString('th-TH')}</p>
              ${item.latitude ? `<p class="text-slate-500">📍 พิกัด: <a href="https://maps.google.com/?q=${item.latitude},${item.longitude}" target="_blank" class="text-blue-600 underline font-medium">ดูบน Google Maps</a></p>` : ''}
              ${item.note ? `<p class="text-slate-700">📝 หมายเหตุ: ${item.note}</p>` : ''}
              ${item.image_url ? `<img src="${item.image_url}" class="w-full h-32 object-cover rounded-lg mt-1.5 border">` : ''}
            </div>
          `;
        }

        div.innerHTML = content;
        listDiv.appendChild(div);

        if (item.latitude && item.longitude) {
          const marker = L.marker([item.latitude, item.longitude]).addTo(map);
          marker.bindPopup(`<div class="text-xs font-sans"><b>${item.name}</b></div>`);
          markers.push(marker);
          bounds.push([item.latitude, item.longitude]);
        }
      });

      if (bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30] });
    }

    function handleCheckChange(id, isChecked) {
      if (isChecked) {
        currentHospitalId = id;
        openModal();
      } else {
        resetCheckin(id);
      }
    }

    function openModal() {
      document.getElementById('checkin-modal').classList.remove('hidden');
      document.getElementById('gps-status').innerText = 'กำลังดึงตำแหน่ง GPS...';
      document.getElementById('photo-input').value = '';
      document.getElementById('note-input').value = '';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById('gps-status').innerText = `📍 พิกัด: ${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;
          },
          () => { document.getElementById('gps-status').innerText = '⚠️ ไม่สามารถดึงตำแหน่ง GPS ได้'; }
        );
      }
    }

    function closeModal() {
      document.getElementById('checkin-modal').classList.add('hidden');
      fetchHospitals();
    }

    async function saveCheckin() {
      const saveBtn = document.getElementById('save-btn');
      saveBtn.innerText = 'กำลังบันทึก...';
      saveBtn.disabled = true;

      let imageUrl = null;
      const fileInput = document.getElementById('photo-input');
      const note = document.getElementById('note-input').value;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileName = `${currentHospitalId}_${Date.now()}.${file.name.split('.').pop()}`;

        const { data: uploadData, error: uploadError } = await supabaseClient.storage
          .from('hospital-photos')
          .upload(fileName, file);

        if (!uploadError) {
          const { data: publicUrlData } = supabaseClient.storage
            .from('hospital-photos')
            .getPublicUrl(fileName);
          imageUrl = publicUrlData.publicUrl;
        }
      }

      await supabaseClient.from('hospitals').update({
        is_checked: true,
        checked_at: new Date().toISOString(),
        latitude: currentLat,
        longitude: currentLng,
        image_url: imageUrl,
        note: note
      }).eq('id', currentHospitalId);

      saveBtn.innerText = 'บันทึกข้อมูล';
      saveBtn.disabled = false;
      closeModal();
    }

    async function resetCheckin(id) {
      await supabaseClient.from('hospitals').update({
        is_checked: false, checked_at: null, latitude: null, longitude: null, image_url: null, note: null
      }).eq('id', id);
      fetchHospitals();
    }

    initMap();
    fetchHospitals();
  </script>
</body>
</html>
